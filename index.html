<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>犬コロが入れる店</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="犬コロ店" />
  <meta name="theme-color" content="#f8fafc" />
  
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { -webkit-overflow-scrolling: touch; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

  <div class="min-h-screen w-full max-w-md mx-auto bg-slate-50 relative pb-12 shadow-2xl flex flex-col">
    
    <!-- 固定ヘッダー -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-2xl animate-bounce">🐩</span>
          <div>
            <h1 class="text-base font-extrabold text-slate-900 tracking-tight leading-none">犬コロが入れる店</h1>
            <span class="text-[10px] text-slate-400 font-bold">湘南・店内同伴OK限定</span>
          </div>
        </div>
        <span class="text-[11px] font-bold bg-amber-500 text-white px-2.5 py-1 rounded-full shadow-sm">
          小型犬特化
        </span>
      </div>

      <!-- エリア切り替えタブ -->
      <div class="px-3 pb-2.5 flex space-x-2 overflow-x-auto hide-scrollbar" id="area-tabs">
        <button onclick="changeArea('ALL')" class="tab-btn active shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-slate-900 text-white shadow-sm transition">全エリア</button>
        <button onclick="changeArea('鵠沼')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">鵠沼</button>
        <button onclick="changeArea('鎌倉')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">鎌倉</button>
        <button onclick="changeArea('藤沢')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">藤沢</button>
        <button onclick="changeArea('茅ヶ崎')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">茅ヶ崎</button>
        <button onclick="changeArea('逗子')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">逗子</button>
      </div>
    </header>

    <!-- 店舗カード一覧リスト -->
    <main class="flex-1 p-3.5 space-y-3.5" id="spot-list"></main>

  </div>

  <script>
    // ジャンルごとのアクセントカラー＆アイコン
    const CATEGORY_STYLES = {
      coffee: { icon: "☕", gradient: "from-amber-600 to-yellow-600", tagBg: "bg-amber-50 text-amber-900" },
      diner:  { icon: "🍔", gradient: "from-sky-600 to-indigo-600",  tagBg: "bg-sky-50 text-sky-900" },
      dining: { icon: "🍷", gradient: "from-rose-600 to-pink-600",   tagBg: "bg-rose-50 text-rose-900" },
      sweet:  { icon: "🍦", gradient: "from-emerald-600 to-teal-600", tagBg: "bg-emerald-50 text-emerald-900" },
      dog:    { icon: "🐾", gradient: "from-orange-500 to-amber-500", tagBg: "bg-orange-50 text-orange-900" }
    };

    const SPOTS = [
      {
        id: 1,
        name: "7325coffee（ナミニココーヒー）",
        area: "鵠沼",
        type: "coffee",
        categoryText: "自家焙煎珈琲・ベイク",
        address: "藤沢市鵠沼海岸1-9-17",
        style: "椅子（マット） / 床OK",
        parking: "あり",
        pants: "任意（マナー重視）",
        highlight: "海散歩帰りの定番スポット",
        url: "https://www.google.com/maps/search/?api=1&query=7325coffee+藤沢市鵠沼海岸1丁目",
        note: "ウッド調の温かい店内。店員さんも犬好きでトイプー歓迎。カフェマット持参がおすすめです。"
      },
      {
        id: 2,
        name: "Days Kugenuma",
        area: "鵠沼",
        type: "diner",
        categoryText: "アメリカンダイナー",
        address: "藤沢市鵠沼海岸2-7-7",
        style: "テーブル席・足元OK",
        parking: "近隣コインP",
        pants: "任意",
        highlight: "鵠沼海岸商店街すぐ",
        url: "https://www.google.com/maps/search/?api=1&query=Days+Kugenuma+藤沢市鵠沼海岸",
        note: "ハンバーガーやカフェご飯をトイプーと一緒に店内でゆったり楽しめます。"
      },
      {
        id: 3,
        name: "Cafe Grand-Mere（グランメール）",
        area: "鎌倉",
        type: "dining",
        categoryText: "老舗洋食・喫茶",
        address: "鎌倉市雪ノ下1-8-36 津脇ビル2F",
        style: "バッグ / マットで椅子OK",
        parking: "なし",
        pants: "任意",
        highlight: "雨の日の小町通りで重宝",
        url: "https://www.google.com/maps/search/?api=1&query=グランメール+鎌倉市雪ノ下1丁目8-36",
        note: "小町通りの路地裏2F。落ち着いた洋食屋さんで、天候問わず店内でトイプーと食事ができます。"
      },
      {
        id: 4,
        name: "Andy Cafe 鎌倉店",
        area: "鎌倉",
        type: "dog",
        categoryText: "本格ドッグカフェ",
        address: "鎌倉市由比ガ浜2-22-11",
        style: "全席同伴OK・ソファー可",
        parking: "専用あり",
        pants: "必須（販売あり）",
        highlight: "わんこメニュー充実",
        url: "https://www.google.com/maps/search/?api=1&query=Andy+Cafe+鎌倉店",
        note: "由比ヶ浜すぐ。ワンちゃん専用の温かいご飯が頼めます。店内衛生のためマナーパンツ必須。"
      },
      {
        id: 5,
        name: "café蕾（カフェ ツボミ）",
        area: "鎌倉",
        type: "sweet",
        categoryText: "和カフェ・甘味処",
        address: "鎌倉市長谷2-13-37",
        style: "足元 / 抱っこ",
        parking: "なし",
        pants: "任意",
        highlight: "長谷寺・大仏散策の休憩に",
        url: "https://www.google.com/maps/search/?api=1&query=カフェ蕾+鎌倉市長谷2丁目",
        note: "風情ある古民家でくずきりや和スイーツを。静かに落ち着いて過ごしたい時に最適です。"
      },
      {
        id: 6,
        name: "soundwave coffee roasters",
        area: "藤沢",
        type: "coffee",
        categoryText: "コーヒースタンド",
        address: "藤沢市鵠沼石上1-8-11",
        style: "ベンチ席・足元OK",
        parking: "なし",
        pants: "任意",
        highlight: "藤沢駅南口から徒歩3分",
        url: "https://www.google.com/maps/search/?api=1&query=soundwave+coffee+roasters+藤沢市",
        note: "美味しいスペシャリティコーヒーが飲めるスタンド。駅近で犬連れ店内入店できる貴重なお店。"
      },
      {
        id: 7,
        name: "SAJI（サジ）",
        area: "藤沢",
        type: "dining",
        categoryText: "ビストロ・ワイン",
        address: "藤沢市鵠沼石上2-1-11",
        style: "抱っこ / 足元",
        parking: "なし",
        pants: "任意",
        highlight: "夜もトイプーとディナーOK",
        url: "https://www.google.com/maps/search/?api=1&query=SAJI+藤沢市鵠沼石上2丁目",
        note: "ナチュールワインとお料理が美味しい隠れ家店。愛犬と一緒に本格ビストロが味わえます。"
      },
      {
        id: 8,
        name: "Plenty's（プレンティーズ 茅ヶ崎本店）",
        area: "茅ヶ崎",
        type: "sweet",
        categoryText: "手作りアイス・ワッフル",
        address: "茅ヶ崎市東海岸北1-7-23",
        style: "奥のイートイン席OK",
        parking: "提携あり",
        pants: "任意",
        highlight: "茅ヶ崎の超有名アイス",
        url: "https://www.google.com/maps/search/?api=1&query=プレンティーズ+茅ヶ崎本店",
        note: "イートイン席でトイプーを抱っこして食べられます。夏場のお散歩帰りにも人気。"
      },
      {
        id: 9,
        name: "サザンビーチカフェ",
        area: "茅ヶ崎",
        type: "diner",
        categoryText: "シーサイドダイナー",
        address: "茅ヶ崎市中海岸4-12986-52",
        style: "インドア・半屋内席OK",
        parking: "施設Pあり",
        pants: "任意",
        highlight: "海が目の前の絶景ロケーション",
        url: "https://www.google.com/maps/search/?api=1&query=サザンビーチカフェ+茅ヶ崎市中海岸",
        note: "サザンビーチ目の前。インドア席も愛犬同伴OKで、風の強い日や日差しが強い日も安心。"
      },
      {
        id: 10,
        name: "ZUSHI atelier cafe",
        area: "逗子",
        type: "sweet",
        categoryText: "カフェ・スイーツ",
        address: "逗子市逗子5-2-53",
        style: "マットで椅子 / 抱っこ",
        parking: "近隣コインP",
        pants: "任意",
        highlight: "逗子駅近くの静かな路地裏",
        url: "https://www.google.com/maps/search/?api=1&query=ZUSHI+atelier+cafe+逗子市",
        note: "落ち着いた静かな空間。トイプードルとゆったりスイーツやお茶を楽しめる穴場カフェ。"
      },
      {
        id: 11,
        name: "L'atelier Cocon（ラトリエ ココン）",
        area: "逗子",
        type: "coffee",
        categoryText: "ベーカリーカフェ",
        address: "逗子市新宿1-4-28",
        style: "店内イートインOK",
        parking: "あり",
        pants: "任意",
        highlight: "逗子海岸すぐそば",
        url: "https://www.google.com/maps/search/?api=1&query=ラトリエココン+逗子市新宿",
        note: "焼きたてパンが自慢の海近くベーカリー。朝のお散歩ついでに愛犬と店内でモーニング可能。"
      }
    ];

    let currentArea = 'ALL';

    function renderList() {
      const container = document.getElementById('spot-list');
      container.innerHTML = '';

      const filtered = currentArea === 'ALL' ? SPOTS : SPOTS.filter(s => s.area === currentArea);

      filtered.forEach(spot => {
        const theme = CATEGORY_STYLES[spot.type] || CATEGORY_STYLES.coffee;

        const card = document.createElement('a');
        card.href = spot.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "block bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/90 active:scale-[0.98] transition-all hover:shadow-md";

        card.innerHTML = `
          <!-- 上部：カラフルなヘッダーバナー -->
          <div class="bg-gradient-to-r ${theme.gradient} px-3.5 py-2.5 flex items-center justify-between text-white">
            <div class="flex items-center space-x-2">
              <span class="text-xl bg-white/20 backdrop-blur rounded-full w-8 h-8 flex items-center justify-center">${theme.icon}</span>
              <div>
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-white/80 block">${spot.area}</span>
                <span class="text-xs font-bold">${spot.categoryText}</span>
              </div>
            </div>
            <span class="text-[11px] font-bold bg-white text-slate-900 px-2.5 py-0.5 rounded-full shadow-sm">
              マップ詳細 ↗
            </span>
          </div>

          <div class="p-3.5">
            <!-- 店名 -->
            <h2 class="text-base font-extrabold text-slate-900 leading-tight mb-1">
              ${spot.name}
            </h2>
            
            <p class="text-[11px] text-slate-400 mb-3 flex items-center">
              📍 <span class="ml-1">${spot.address}</span>
            </p>

            <!-- トイプー向けステータスグリッド -->
            <div class="grid grid-cols-3 gap-1.5 mb-3 bg-slate-50 p-2 rounded-xl border border-slate-100 text-center">
              <div class="p-1">
                <span class="text-[9px] text-slate-400 font-bold block">店内スタイル</span>
                <span class="text-[11px] font-extrabold text-slate-700 leading-tight">${spot.style}</span>
              </div>
              <div class="p-1 border-x border-slate-200/60">
                <span class="text-[9px] text-slate-400 font-bold block">駐車場</span>
                <span class="text-[11px] font-extrabold text-slate-700 leading-tight">${spot.parking}</span>
              </div>
              <div class="p-1">
                <span class="text-[9px] text-slate-400 font-bold block">マナーパンツ</span>
                <span class="text-[11px] font-extrabold ${spot.pants.includes('必須') ? 'text-rose-600' : 'text-slate-700'} leading-tight">${spot.pants}</span>
              </div>
            </div>

            <!-- おすすめポイント & メモ -->
            <div class="flex items-center gap-1.5 mb-2">
              <span class="text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md">
                ★ ${spot.highlight}
              </span>
            </div>

            <p class="text-xs text-slate-600 leading-relaxed">
              ${spot.note}
            </p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function changeArea(area) {
      currentArea = area;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        if ((area === 'ALL' && btn.innerText === '全エリア') || btn.innerText === area) {
          btn.className = 'tab-btn active shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-slate-900 text-white shadow-sm transition';
        } else {
          btn.className = 'tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition';
        }
      });

      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderList();
  </script>
</body>
</html>
