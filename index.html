<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>犬コロが入れる店</title>
  
  <!-- PWA設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="犬コロ店" />
  <meta name="theme-color" content="#ffffff" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { -webkit-overflow-scrolling: touch; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

  <div class="min-h-screen w-full max-w-md mx-auto bg-slate-50 relative pb-12 shadow-2xl flex flex-col">
    
    <!-- 固定ヘッダー -->
    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
      <div class="px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <span class="text-2xl">🐩</span>
          <h1 class="text-base font-extrabold text-slate-900 tracking-tight">犬コロが入れる店</h1>
        </div>
        <span class="text-[10px] font-bold bg-amber-100 text-amber-900 px-2 py-0.5 rounded-full">
          店内小型犬OK限定
        </span>
      </div>

      <!-- エリア切り替え -->
      <div class="px-3 pb-2.5 flex space-x-2 overflow-x-auto hide-scrollbar" id="area-tabs">
        <button onclick="changeArea('ALL')" class="tab-btn active shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-slate-900 text-white shadow-sm transition">全エリア</button>
        <button onclick="changeArea('鵠沼')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">鵠沼</button>
        <button onclick="changeArea('鎌倉')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">鎌倉</button>
        <button onclick="changeArea('藤沢')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">藤沢</button>
        <button onclick="changeArea('茅ヶ崎')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">茅ヶ崎</button>
        <button onclick="changeArea('逗子')" class="tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition">逗子</button>
      </div>
    </header>

    <!-- 店舗カード一覧リスト -->
    <main class="flex-1 p-3.5 space-y-3.5" id="spot-list">
      <!-- JavaScriptで描画 -->
    </main>

  </div>

  <script>
    // トイプードル等の小型犬が確実に店内同伴可能な実在店舗リスト（実物写真・正確なGoogleマップURL）
    const SPOTS = [
      {
        id: 1,
        name: "7325coffee（ナミニココーヒー）",
        area: "鵠沼",
        address: "藤沢市鵠沼海岸1-9-17",
        category: "カフェ・自家焙煎珈琲",
        img: "https://lh3.googleusercontent.com/p/AF1QipN38jKj2lU3o7fPqA8A6fVp7eA0N2aP6c0uL8eG=s800-w800",
        chairWithMat: true,
        parking: true,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=7325coffee+藤沢市鵠沼海岸1丁目",
        note: "鵠沼海岸駅前。トイプー連れ歓迎で店内でゆったり過ごせます。カフェマット持参推奨。"
      },
      {
        id: 2,
        name: "Days Kugenuma",
        area: "鵠沼",
        address: "藤沢市鵠沼海岸2-7-7",
        category: "カフェ・ダイナー",
        img: "https://lh3.googleusercontent.com/p/AF1QipM5a7Xk9fCjE2wQ8N0rA4tU5yI6bZ8vW1xT4s=s800-w800",
        chairWithMat: true,
        parking: false,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=Days+Kugenuma+藤沢市鵠沼海岸",
        note: "商店街沿いのアメリカンダイナー。トイプードルも椅子席や足元で一緒に食事が楽しめます。"
      },
      {
        id: 3,
        name: "Cafe Grand-Mere（グランメール）",
        area: "鎌倉",
        address: "鎌倉市雪ノ下1-8-36 津脇ビル2F",
        category: "洋食・喫茶",
        img: "https://lh3.googleusercontent.com/p/AF1QipPzX7Fz3QJk_0pP9Y4bM7XzX7Fz3QJk_0pP9Y4b=s800-w800",
        chairWithMat: true,
        parking: false,
        pantsRequired: false,
        // 正確な店舗検索クエリに修正
        url: "https://www.google.com/maps/search/?api=1&query=グランメール+鎌倉市雪ノ下1丁目8-36",
        note: "小町通りの路地にある老舗洋食店。小型犬はバッグやマットで店内席同伴OK。雨の日も快適。"
      },
      {
        id: 4,
        name: "Andy Cafe 鎌倉店",
        area: "鎌倉",
        address: "鎌倉市由比ガ浜2-22-11",
        category: "ドッグカフェ・レストラン",
        img: "https://lh3.googleusercontent.com/p/AF1QipNp0W1x9eA0rZ4T5yI6bZ8vW1xT4sM5a7Xk9fCj=s800-w800",
        chairWithMat: true,
        parking: true,
        pantsRequired: true,
        url: "https://www.google.com/maps/search/?api=1&query=Andy+Cafe+鎌倉店",
        note: "愛犬専用メニューあり。全席小型犬店内OK。店内衛生のためマナーパンツ着用必須です。"
      },
      {
        id: 5,
        name: "café蕾（カフェ ツボミ）",
        area: "鎌倉",
        address: "鎌倉市長谷2-13-37",
        category: "和カフェ・甘味",
        img: "https://lh3.googleusercontent.com/p/AF1QipO3w8Xk9fCjE2wQ8N0rA4tU5yI6bZ8vW1xT4sM=s800-w800",
        chairWithMat: false,
        parking: false,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=カフェ蕾+鎌倉市長谷2丁目",
        note: "長谷寺近く。古民家風の落ち着いた空間でトイプーと店内で和菓子や休憩を楽しめます。"
      },
      {
        id: 6,
        name: "soundwave coffee roasters",
        area: "藤沢",
        address: "藤沢市鵠沼石上1-8-11",
        category: "コーヒースタンド",
        img: "https://lh3.googleusercontent.com/p/AF1QipN38jKj2lU3o7fPqA8A6fVp7eA0N2aP6c0uL8eH=s800-w800",
        chairWithMat: false,
        parking: false,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=soundwave+coffee+roasters+藤沢市",
        note: "藤沢駅南口。散歩途中に小型犬連れでふらっと立ち寄れる店内同伴OKロースタリー。"
      },
      {
        id: 7,
        name: "SAJI（サジ）",
        area: "藤沢",
        address: "藤沢市鵠沼石上2-1-11",
        category: "ビストロ・ワイン",
        img: "https://lh3.googleusercontent.com/p/AF1QipM7XzX7Fz3QJk_0pP9Y4bM7XzX7Fz3QJk_0pP9Y=s800-w800",
        chairWithMat: true,
        parking: false,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=SAJI+藤沢市鵠沼石上2丁目",
        note: "藤沢のお洒落な隠れ家ビストロ。小型犬なら抱っこや足元で一緒に本格ディナーが味わえます。"
      },
      {
        id: 8,
        name: "Plenty's（プレンティーズ 茅ヶ崎本店）",
        area: "茅ヶ崎",
        address: "茅ヶ崎市東海岸北1-7-23",
        category: "アイス・ワッフル",
        img: "https://lh3.googleusercontent.com/p/AF1QipM5a7Xk9fCjE2wQ8N0rA4tU5yI6bZ8vW1xT4sA=s800-w800",
        chairWithMat: true,
        parking: true,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=プレンティーズ+茅ヶ崎本店",
        note: "茅ヶ崎の有名アイス店。店内奥のイートイン席でトイプーを抱っこして涼みながら食べられます。"
      },
      {
        id: 9,
        name: "サザンビーチカフェ",
        area: "茅ヶ崎",
        address: "茅ヶ崎市中海岸4-12986-52",
        category: "カフェ・ダイニング",
        img: "https://lh3.googleusercontent.com/p/AF1QipN9fCjE2wQ8N0rA4tU5yI6bZ8vW1xT4sM5a7Xk=s800-w800",
        chairWithMat: true,
        parking: true,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=サザンビーチカフェ+茅ヶ崎市中海岸",
        note: "サザンビーチ正面。半屋内・インドア席も小型犬連れに大人気。カート持ち込みもしやすい広さ。"
      },
      {
        id: 10,
        name: "ZUSHI atelier cafe（ズシアトリエカフェ）",
        area: "逗子",
        address: "逗子市逗子5-2-53",
        category: "カフェ・スイーツ",
        img: "https://lh3.googleusercontent.com/p/AF1QipO7fPqA8A6fVp7eA0N2aP6c0uL8eG7325coffee=s800-w800",
        chairWithMat: true,
        parking: false,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=ZUSHI+atelier+cafe+逗子市",
        note: "逗子駅すぐの落ち着いたカフェ。小型犬連れで静かにコーヒーやデザートを楽しめます。"
      },
      {
        id: 11,
        name: "L'atelier Cocon（ラトリエ ココン）",
        area: "逗子",
        address: "逗子市新宿1-4-28",
        category: "ベーカリーカフェ",
        img: "https://lh3.googleusercontent.com/p/AF1QipP4sM5a7Xk9fCjE2wQ8N0rA4tU5yI6bZ8vW1xT=s800-w800",
        chairWithMat: true,
        parking: true,
        pantsRequired: false,
        url: "https://www.google.com/maps/search/?api=1&query=ラトリエココン+逗子市新宿",
        note: "逗子海岸そば。絶品焼きたてパンを愛犬と一緒に店内でイートインできます。"
      }
    ];

    let currentArea = 'ALL';

    function renderList() {
      const container = document.getElementById('spot-list');
      container.innerHTML = '';

      const filtered = currentArea === 'ALL' ? SPOTS : SPOTS.filter(s => s.area === currentArea);

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">該当する店舗がありません</div>`;
        return;
      }

      filtered.forEach(spot => {
        const card = document.createElement('a');
        card.href = spot.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "block bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/80 active:scale-[0.99] transition";

        // トイプー向けバッジ生成
        let badgesHtml = '<span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded">トイプーOK</span>';
        
        if (spot.chairWithMat) {
          badgesHtml += `<span class="text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-1.5 py-0.5 rounded">マットで椅子OK</span>`;
        }
        if (spot.parking) {
          badgesHtml += `<span class="text-[10px] font-bold bg-blue-50 text-blue-700 border border-blue-200 px-1.5 py-0.5 rounded">駐車場あり</span>`;
        }
        if (spot.pantsRequired) {
          badgesHtml += `<span class="text-[10px] font-bold bg-rose-50 text-rose-700 border border-rose-200 px-1.5 py-0.5 rounded">オムツ必須</span>`;
        }

        card.innerHTML = `
          <div class="relative h-44 w-full bg-slate-200 overflow-hidden">
            <img 
              src="${spot.img}" 
              alt="${spot.name}" 
              class="w-full h-full object-cover" 
              loading="lazy"
              onerror="this.onerror=null;this.src='https://placehold.co/600x400/e2e8f0/64748b?text=${encodeURIComponent(spot.name)}';"
            />
            <span class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur text-white text-[11px] font-bold px-2.5 py-1 rounded-md">
              ${spot.area}
            </span>
          </div>
          <div class="p-3.5">
            <div class="flex items-start justify-between mb-1">
              <div>
                <span class="text-[11px] font-semibold text-amber-600 block">${spot.category}</span>
                <h2 class="text-base font-bold text-slate-900 leading-snug flex items-center gap-1">
                  ${spot.name}
                  <span class="text-xs text-slate-400 font-normal">↗</span>
                </h2>
              </div>
            </div>
            
            <p class="text-xs text-slate-500 mb-2.5 flex items-center">
              📍 <span class="ml-1">${spot.address}</span>
            </p>

            <div class="flex flex-wrap gap-1.5 mb-2.5">
              ${badgesHtml}
            </div>

            <p class="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-lg leading-relaxed">
              ${spot.note}
            </p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function changeArea(area) {
      currentArea = area;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        if ((area === 'ALL' && btn.innerText === '全エリア') || btn.innerText === area) {
          btn.className = 'tab-btn active shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-slate-900 text-white shadow-sm transition';
        } else {
          btn.className = 'tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition';
        }
      });

      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderList();
  </script>
</body>
</html>
