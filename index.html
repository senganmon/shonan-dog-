    let currentArea = 'ALL';
    let searchQuery = '';
    let filters = {
      parking: false,
      chair: false,
      dogMenu: false
    };

    function getFavorites() {
      try {
        return JSON.parse(localStorage.getItem('inukoro_favs') || '[]');
      } catch (e) {
        return [];
      }
    }

    function toggleFavorite(id, event) {
      event.preventDefault();
      event.stopPropagation();
      let favs = getFavorites();
      if (favs.includes(id)) {
        favs = favs.filter(item => item !== id);
      } else {
        favs.push(id);
      }
      localStorage.setItem('inukoro_favs', JSON.stringify(favs));
      renderList();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderList();
    }

    function toggleFilter(key) {
      filters[key] = !filters[key];
      const btn = document.getElementById(`filter-${key}`);
      
      if (filters[key]) {
        btn.className = "filter-chip active text-[11px] px-2.5 py-1 rounded-lg font-bold bg-amber-500 text-white shadow-sm flex items-center gap-1 transition";
      } else {
        btn.className = "filter-chip text-[11px] px-2.5 py-1 rounded-lg font-bold bg-slate-100 text-slate-600 flex items-center gap-1 transition";
      }

      renderList();
    }

    function renderList() {
      const container = document.getElementById('spot-list');
      container.innerHTML = '';
      const favs = getFavorites();

      let filtered = SPOTS;

      if (currentArea === 'FAV') {
        filtered = filtered.filter(s => favs.includes(s.id));
      } else if (currentArea !== 'ALL') {
        filtered = filtered.filter(s => s.area === currentArea);
      }

      if (filters.parking) filtered = filtered.filter(s => s.hasParking);
      if (filters.chair) filtered = filtered.filter(s => s.canChair);
      if (filters.dogMenu) filtered = filtered.filter(s => s.hasDogMenu);

      if (searchQuery) {
        filtered = filtered.filter(s => {
          const target = (s.name + s.area + s.categoryText + s.address + s.highlight + s.note + s.rainFeature).toLowerCase();
          return target.includes(searchQuery);
        });
      }

      document.getElementById('spot-count').innerText = `${filtered.length}件のお店`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-400 text-xs">
            <span class="text-3xl block mb-2">🐾</span>
            該当するお店が見つかりませんでした
          </div>`;
        return;
      }

      filtered.forEach(spot => {
        const theme = CATEGORY_STYLES[spot.type] || CATEGORY_STYLES.coffee;
        const isFav = favs.includes(spot.id);

        const card = document.createElement('a');
        card.href = spot.url;
        card.target = "_blank";
        card.rel = "noopener noreferrer";
        card.className = "block bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/90 active:scale-[0.98] transition-all hover:shadow-md";

        let serviceBadges = '';
        if (spot.hasDogMenu) serviceBadges += `<span class="text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200 px-1.5 py-0.5 rounded">犬メニューあり</span>`;
        if (spot.waterService) serviceBadges += `<span class="text-[10px] font-bold bg-sky-50 text-sky-700 border border-sky-200 px-1.5 py-0.5 rounded">お水サービス</span>`;

        card.innerHTML = `
          <div class="bg-gradient-to-r ${theme.gradient} px-3.5 py-2.5 flex items-center justify-between text-white">
            <div class="flex items-center space-x-2">
              <span class="text-xl bg-white/20 backdrop-blur rounded-full w-8 h-8 flex items-center justify-center">${theme.icon}</span>
              <div>
                <span class="text-[10px] font-extrabold uppercase tracking-wider text-white/80 block">${spot.area}</span>
                <span class="text-xs font-bold">${spot.categoryText}</span>
              </div>
            </div>
            
            <div class="flex items-center gap-2">
              <span class="text-xs font-bold bg-black/20 backdrop-blur px-2.5 py-0.5 rounded-full text-white/90">
                ${spot.area}
              </span>
              <button 
                onclick="toggleFavorite(${spot.id}, event)" 
                class="w-7 h-7 rounded-full bg-white/90 backdrop-blur flex items-center justify-center shadow-sm text-sm active:scale-125 transition"
                title="お気に入りに追加"
              >
                ${isFav ? '❤️' : '🤍'}
              </button>
            </div>
          </div>

          <div class="p-3.5">
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-base font-extrabold text-slate-900 leading-tight">
                ${spot.name}
              </h2>
              <!-- シンプルで邪魔にならないコンパクトナビバッジ -->
              <span class="text-[10px] font-extrabold text-amber-700 bg-amber-50 border border-amber-200 px-2 py-0.5 rounded-md flex items-center gap-0.5 shrink-0 shadow-xs">
                🚗 ナビ起動
              </span>
            </div>
            
            <p class="text-[11px] text-slate-400 mb-2 flex items-center">
              📍 <span class="ml-1">${spot.address}</span>
            </p>

            <div class="flex items-center gap-2 text-[11px] text-slate-600 bg-slate-50 px-2.5 py-1.5 rounded-lg mb-3 border border-slate-100">
              <span class="font-bold text-amber-700">🕒 ${spot.hours}</span>
              <span class="text-slate-300">|</span>
              <span class="text-slate-500 font-medium">休: ${spot.closed}</span>
            </div>

            <div class="grid grid-cols-3 gap-1.5 mb-2.5 bg-slate-50 p-2 rounded-xl border border-slate-100 text-center">
              <div class="p-1">
                <span class="text-[9px] text-slate-400 font-bold block">席タイプ</span>
                <span class="text-[10px] font-extrabold text-slate-700 leading-tight block">${spot.seatType}</span>
                <span class="text-[9px] text-amber-600 font-medium">${spot.styleText}</span>
              </div>
              <div class="p-1 border-x border-slate-200/60">
                <span class="text-[9px] text-slate-400 font-bold block">駐車場</span>
                <span class="text-[11px] font-extrabold text-slate-700 leading-tight block mt-1">${spot.parkingText}</span>
              </div>
              <div class="p-1">
                <span class="text-[9px] text-slate-400 font-bold block">マナーパンツ</span>
                <span class="text-[11px] font-extrabold ${spot.pantsText.includes('必須') ? 'text-rose-600' : 'text-slate-700'} leading-tight block mt-1">${spot.pantsText}</span>
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5 mb-2.5">
              <span class="text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md">
                ★ ${spot.highlight}
              </span>
              ${serviceBadges}
            </div>

            <div class="bg-blue-50/60 border border-blue-100/80 p-2 rounded-lg text-[11px] text-blue-900 mb-2">
              <span class="font-bold">☔ 雨の日：</span>${spot.rainFeature}
            </div>

            <p class="text-xs text-slate-600 leading-relaxed">
              ${spot.note}
            </p>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function changeArea(area) {
      currentArea = area;

      document.querySelectorAll('.tab-btn').forEach(btn => {
        if ((area === 'ALL' && btn.innerText === '全エリア') || 
            (area === 'FAV' && btn.id === 'tab-fav') || 
            btn.innerText === area) {
          if (area === 'FAV') {
            btn.className = 'tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-rose-600 text-white shadow-sm transition flex items-center gap-1';
          } else {
            btn.className = 'tab-btn active shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-slate-900 text-white shadow-sm transition';
          }
        } else {
          if (btn.id === 'tab-fav') {
            btn.className = 'tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-rose-50 text-rose-600 border border-rose-200 transition flex items-center gap-1';
          } else {
            btn.className = 'tab-btn shrink-0 text-xs px-3.5 py-1.5 rounded-full font-bold bg-white text-slate-600 border border-slate-200 transition';
          }
        }
      });

      renderList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderList();
  </script>
